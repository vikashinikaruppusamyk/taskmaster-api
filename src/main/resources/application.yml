server:
  # SERVER_PORT overrides this when it is set.
  port: 8080

spring:
  application:
    name: taskmaster-api

  datasource:
    url: jdbc:postgresql://localhost:5432/taskmaster
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Attachments larger than this are refused with 413.
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt:
    # HS256 signing key, at least 32 characters. The default is for local development
    # only; set JWT_SECRET to something random anywhere else.
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    # How long a token from /api/auth/login stays valid.
    expiry: 60m

  attachments:
    # Folder where uploaded files are kept. Created on first upload.
    directory: ${ATTACHMENTS_DIR:./uploads}

  ai:
    # Leave empty to switch the AI endpoints off; they then answer 503.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    try-it-out-enabled: true
    display-request-duration: true
    filter: true
    # Keeps the token across page reloads after pressing "Authorize".
    persist-authorization: true
  default-produces-media-type: application/json
  default-flat-param-object: true
